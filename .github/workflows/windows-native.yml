name: WinPuttier Windows build

on:
  push:
    branches: [native-win32, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (MSVC x64, static runtime)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Run core parser tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Inspect executable and write checksum
        shell: pwsh
        run: |
          $exe = "build/Release/WinPuttier.exe"
          if (!(Test-Path $exe)) { throw "WinPuttier.exe not found" }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  WinPuttier.exe" | Set-Content "build/Release/SHA256SUMS.txt" -Encoding ascii
          Get-Content "build/Release/SHA256SUMS.txt"
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: WinPuttier-Windows-x64
          path: |
            build/Release/WinPuttier.exe
            build/Release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish WinPuttier 0.5.2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.2"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }
          gh release create $tag "build/Release/WinPuttier.exe" "build/Release/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WinPuttier 0.5.2" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
