name: WinPuttier Windows build

on:
  push:
    branches: [native-win32, main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (MSVC x64, static runtime)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify release version and write checksum
        shell: pwsh
        run: |
          $exe = Get-Item "build/Release/WinPuttier.exe"
          $version = $exe.VersionInfo.ProductVersion
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match executable version $version"
          }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  WinPuttier.exe" | Set-Content "build/Release/SHA256SUMS.txt" -Encoding ascii
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: WinPuttier-Windows-x64
          path: |
            build/Release/WinPuttier.exe
            build/Release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinPuttier-Windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          gh release create $tag "release/WinPuttier.exe" "release/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --verify-tag --title "WinPuttier $($tag.Substring(1))" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
